<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f8fbfd;
    color: #333;
}

/* ---------------- NAVBAR ---------------- */

nav {
    position: sticky;
    top: 0;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 12px 25px;
    flex-wrap: wrap;
    background: white;
    z-index: 10000;
}

.learnx-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex-shrink: 0;
}

.learnx-logo img {
    width: 60px;
    height: 60px;
    object-fit: contain;
}

.logo-text {
    display: flex;
    flex-direction: column;
}

.a2-learn {
    font-size: 32px;
    font-weight: 700;
    color: #092c63;
    line-height: 1.1;
}

.a2-learn span {
    color: #1669ec;
}

.tagline {
    font-size: 13px;
    color: #555;
    margin-top: 5px;
}

/* ---------------- NAVIGATION ---------------- */

.sec-ul {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    list-style: none;
}

.sec-ul a {
    color: #092c63;
    text-decoration: none;
    font-size: 20px;
    font-weight: 600;
}

.sec-ul a.active {
    color: white;
    background: #092c63;
    padding: 10px 16px;
    border-radius: 6px;
}

.sec-ul a:hover {
    color: #1669ec;
}

.sec-ul a.active:hover {
    color: white;
    background: #092c63;
}

/* ---------------- LOGIN BUTTON ---------------- */

.button-div {
    display: flex;
    align-items: center;
    gap: 10px;
}


.button-login	{
				 display: inline-block;
				 padding: 11px 16px;
				 border-radius: 6px;
				 cursor: pointer;
				 font-size: 15px;
				 font-weight: 600;
				 text-decoration: none;
				 color: #092c63;
				 background: white;
				 border: 2px solid #1669ec; }
button:hover {
    opacity: 0.85;
}

/* ---------------- REGISTRATION SECTION ---------------- */

.sec {
    width: 100%;
    padding: 40px 15px;
    background: #f0f5fc;
}

.Formd {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0px 3px 12px #ccc;
}

.Formd h3 {
    text-align: center;
    font-size: 28px;
    color: #092c63;
    margin-bottom: 8px;
}

.Formd p {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.form-heading {
    background: #103b79;
    color: white;
    text-align: center;
    padding: 13px;
    font-size: 19px;
    font-weight: bold;
    border-radius: 5px;
    margin-bottom: 22px;
}

/* FORM INPUTS */

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    font-weight: bold;
    color: #092c63;
    margin-bottom: 8px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 5px;
    font-size: 15px;
    outline: none;
    background: white;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border: 2px solid #1669ec;
}

.form-group textarea {
    height: 75px;
    resize: vertical;
}

/* RADIO BUTTONS */

.radio-box {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    align-items: center;
}

.radio-box label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: normal;
    color: #333;
    margin: 0;
}

.radio-box input {
    width: auto;
    accent-color: #103b79;
}

/* BUTTONS */

.form-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
}

.submit-btn,
.reset-btn {
    padding: 12px 28px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn {
    background: #103b79;
    color: white;
}

.reset-btn {
    background: #ddd;
    color: #333;
}

.submit-btn:hover {
    background: #1669ec;
}

/* ---------------- FOOTER ---------------- */

.bottom-footer {
    width: 100%;
    min-height: 95px;
    padding: 15px 25px;
    background: #092c63;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.footer-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.footer-brand img {
    height: 60px;
    width: 60px;
    object-fit: contain;
}

.a3-learn {
    color: white;
}

.a3-learn span {
    color: #1669ec;
}

.tagline-2 {
    color: white;
    margin-top: 8px;
}

.footer-copy {
    color: #e2eaff;
    font-size: 12px;
    white-space: nowrap;
}

/* ---------------- TABLET RESPONSIVE ---------------- */

@media (max-width: 1000px) {

    nav {
        justify-content: center;
    }

    .bottom-footer {
        flex-wrap: wrap;
        justify-content: center;
        text-align: center;
    }

}

/* ---------------- MOBILE RESPONSIVE ---------------- */

@media (max-width: 600px) {

    nav {
        padding: 15px 10px;
        gap: 15px;
    }

    .a2-learn {
        font-size: 27px;
    }

    .learnx-logo img {
        width: 45px;
        height: 45px;
    }

    .sec-ul {
        width: 100%;
        flex-wrap: wrap;
        gap: 15px;
    }

    .sec-ul a {
        font-size: 14px;
    }

    .button-div {
        justify-content: center;
    }

    .Formd {
        padding: 20px 15px;
    }

    .Formd h3 {
        font-size: 23px;
    }

    .radio-box {
        gap: 15px;
    }

    .form-buttons {
        flex-wrap: wrap;
    }

    .bottom-footer {
        flex-direction: column;
        padding: 25px 12px;
        gap: 22px;
    }

    .footer-brand {
        justify-content: center;
    }

    .footer-copy {
        white-space: normal;
        line-height: 1.6;
        text-align: center;
    }

}

</style>
</head>

<body>

<!-- ---------------- NAVBAR ---------------- -->

<nav>

    <a href="#" class="learnx-logo">

        <img src="LX.PNG" alt="LearnX Logo">

        <div class="logo-text">

            <h1 class="a2-learn">
                Online<span>Course</span>
            </h1>

            <p class="tagline">Learn Anytime, Anywhere</p>

        </div>

    </a>

    <ul class="sec-ul">

        <li><a href="index.html">Home</a></li>

        <li><a href="Courses.html">Courses</a></li>

        <li><a href="About Us.html">About Us</a></li>

        <li><a href="Contact.html">Contact Us</a></li>

        <li><a href="Registration.html" class="active">Registration</a></li>

    </ul>

    <div class="button-div">

             <a href="index.html#student-login" class="button-login">&#128100; Login</a>
       
    </div>

</nav>


<!-- ---------------- REGISTRATION SECTION ---------------- -->

<section class="sec">

    <div class="Formd">

        <h3>Create Your Account</h3>

        <p>Register now and start learning online</p>

        <form action="#" method="post">

            <div class="form-heading">
                Registration Form
            </div>

            <!-- FULL NAME -->

            <div class="form-group">

                <label for="Name">Full Name:</label>

                <input type="text" name="Name" id="Name"
                placeholder="Enter your full name" required>

            </div>

            <!-- GUARDIAN NAME -->

            <div class="form-group">

                <label for="Guardian">Guardian Name:</label>

                <input type="text" name="Guardian" id="Guardian"
                placeholder="Enter your guardian name" required>

            </div>

            <!-- DATE OF BIRTH -->

            <div class="form-group">

                <label for="DOB">Date of Birth:</label>

                <input type="date" name="DOB" id="DOB" required>

            </div>

            <!-- GENDER -->

            <div class="form-group">

                <label>Gender:</label>

                <div class="radio-box">

                    <label>
                        <input type="radio" name="Gender" value="Male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="Gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="Gender" value="Other">
                        Other
                    </label>

                </div>

            </div>

            <!-- ADDRESS -->

            <div class="form-group">

                <label for="Address">Address:</label>

                <textarea name="Address" id="Address"
                placeholder="Enter your complete address" required></textarea>

            </div>

            <!-- DISTRICT -->

            <div class="form-group">

                <label for="District">District:</label>

                <select name="District" id="District" required>

                    <option value="">-- Choose District --</option>

                    <option>Prayagraj</option>
                    <option>Rewa</option>
                    <option>Mirzapur</option>
                    <option>Kaushambi</option>
                    <option>Chitrakoot</option>
                    <option>Varanasi</option>

                </select>

            </div>

            <!-- PIN CODE -->

            <div class="form-group">

                <label for="Pin">Pin Code:</label>

                <input type="text" name="Pin" id="Pin"
                placeholder="Enter 6 digit Pin Code"
                maxlength="6" pattern="[0-9]{6}" required>

            </div>

            <!-- CATEGORY -->

            <div class="form-group">

                <label>Category:</label>

                <div class="radio-box">

                    <label>
                        <input type="radio" name="Category" value="General" required>
                        General
                    </label>

                    <label>
                        <input type="radio" name="Category" value="OBC">
                        OBC
                    </label>

                    <label>
                        <input type="radio" name="Category" value="SC">
                        SC/ST
                    </label>

                    <label>
                        <input type="radio" name="Category" value="Other">
                        Other
                    </label>

                </div>

            </div>

            <!-- MOBILE NUMBER -->

            <div class="form-group">

                <label for="Mo">Mobile Number:</label>

                <input type="tel" name="Mobile" id="Mo"
                placeholder="Enter your mobile number"
                maxlength="10" pattern="[0-9]{10}" required>

            </div>

            <!-- EMAIL -->

            <div class="form-group">

                <label for="Email">Email Address:</label>

                <input type="email" name="Email" id="Email"
                placeholder="Enter your email address" required>

            </div>

            <!-- COURSE -->

            <div class="form-group">

                <label for="Course">Select Course:</label>

                <select name="Course" id="Course" required>

                    <option value="">-- Choose Your Course --</option>

                    <option>O Level</option>

                    <option>A Level</option>

                    <option>B Level</option>

                    <option>C Level</option>

                </select>

            </div>

            <!-- PASSWORD -->

            <div class="form-group">

                <label for="Password">Create Password:</label>

                <input type="password" name="Password" id="Password"
                placeholder="Create your password" required>

            </div>

            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="Confirm">Confirm Password:</label>

                <input type="password" name="Confirm" id="Confirm"
                placeholder="Confirm your password" required>

            </div>

            <!-- BUTTONS -->

            <div class="form-buttons">

                <button type="submit" class="submit-btn">
                    Register Now
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>

            </div>

        </form>

    </div>

</section>


<!-- ---------------- FOOTER ---------------- -->

<footer class="bottom-footer">

    <div class="footer-brand">

        <img src="LX.PNG" alt="LearnX Logo">

        <div>

            <h1 class="a3-learn">
                Online<span>Course</span>
            </h1>

            <p class="tagline-2">
                Learn Anytime, Anywhere
            </p>

        </div>

    </div>

    <p class="footer-copy">
        © 2026 Online Batch. All Rights Reserved.
    </p>

</footer>

</body>
</html>
